[platformio]
default_envs = m5stack-atom

[env]
platform = espressif32@^6.9.0
board = m5stack-atom
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^2.3.0
    adafruit/Adafruit NeoPixel@^1.12.0

[env:m5stack-atom]
build_flags = -DCORE_DEBUG_LEVEL=1

; Connects, then dumps every service/characteristic to Serial.
[env:debug-dump]
build_flags = -DCORE_DEBUG_LEVEL=1 -DHUE_DEBUG_DUMP
