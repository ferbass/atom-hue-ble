[platformio]
default_envs = m5stack-atom

[env]
platform = espressif32@^6.9.0
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^2.3.0

[atom]
board = m5stack-atom
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit NeoPixel@^1.12.0

[env:m5stack-atom]
board = ${atom.board}
lib_deps = ${atom.lib_deps}
build_flags = -DCORE_DEBUG_LEVEL=1 -DBOARD_ATOM_LITE

; Deep sleeps between presses: wakes on the button, connects, acts, sleeps again.
[env:m5stack-atom-lowpower]
board = ${atom.board}
lib_deps = ${atom.lib_deps}
build_flags = -DCORE_DEBUG_LEVEL=1 -DBOARD_ATOM_LITE -DLOW_POWER

[env:m5stack-coreink]
board = m5stack-coreink
lib_deps =
    ${env.lib_deps}
    m5stack/M5Unified@^0.2.5
build_flags = -DCORE_DEBUG_LEVEL=1 -DBOARD_CORE_INK -DLOW_POWER

; Connects, then dumps every service/characteristic to Serial.
[env:debug-dump]
board = ${atom.board}
lib_deps = ${atom.lib_deps}
build_flags = -DCORE_DEBUG_LEVEL=1 -DBOARD_ATOM_LITE -DHUE_DEBUG_DUMP
